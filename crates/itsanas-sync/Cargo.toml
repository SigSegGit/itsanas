[package]
name = "itsanas-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Log merge, conflict resolution and convergence for ITSaNAS"

[features]
default = ["simulation"]
# The deterministic multi-device swarm used to prove convergence. On by default
# because it is how the crate's central claim is demonstrated, and separable
# because a production daemon has no reason to link a temporary-directory crate.
simulation = ["dep:tempfile"]

[dependencies]
blake3 = "1.8.7"
itsanas-crypto = { version = "0.1.0", path = "../itsanas-crypto" }
itsanas-store = { version = "0.1.0", path = "../itsanas-store" }
tempfile = { version = "3.23.0", optional = true }
thiserror = "2.0.20"

[lints]
workspace = true

[dev-dependencies]
itsanas-testkit = { version = "0.1.0", path = "../itsanas-testkit" }
tempfile = "3.23.0"
