[package]
name = "itsanas-coord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The ITSaNAS coordinator: a signed notice board that holds no keys and no data"

[dependencies]
itsanas-crypto = { version = "0.1.0", path = "../itsanas-crypto" }
itsanas-tls = { version = "0.1.0", path = "../itsanas-tls" }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "logging"] }
itsanas-wire = { version = "0.1.0", path = "../itsanas-wire" }
postcard = { version = "1.1.1", default-features = false, features = ["use-std"] }
redb = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.23.0"
