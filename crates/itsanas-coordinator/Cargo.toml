[dependencies]
clap = { version = "4.5.51", features = ["derive", "env"] }
ctrlc = "3.5.0"
itsanas-coord = { version = "0.1.0", path = "../itsanas-coord" }
itsanas-crypto = { version = "0.1.0", path = "../itsanas-crypto" }

[lints]
workspace = true
