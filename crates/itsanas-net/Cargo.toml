[package]
name = "itsanas-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Peer protocol and transport for ITSaNAS"

[dependencies]
blake3 = "1.8.7"
itsanas-crypto = { version = "0.1.0", path = "../itsanas-crypto" }
itsanas-store = { version = "0.1.0", path = "../itsanas-store" }
itsanas-sync = { version = "0.1.0", path = "../itsanas-sync", default-features = false }
postcard = { version = "1.1.1", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"

[lints]
workspace = true

[dev-dependencies]
itsanas-testkit = { version = "0.1.0", path = "../itsanas-testkit" }
tempfile = "3.23.0"
