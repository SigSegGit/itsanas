[package]
name = "itsanas-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface for ITSaNAS"

[lib]
name = "itsanas_cli"
path = "src/lib.rs"

[[bin]]
name = "itsanas"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
getrandom = "0.4.3"
clap = { version = "4.5.51", features = ["derive", "env"] }
ctrlc = "3.5.0"
itsanas-coord = { version = "0.1.0", path = "../itsanas-coord" }
itsanas-crypto = { version = "0.1.0", path = "../itsanas-crypto" }
itsanas-discover = { version = "0.1.0", path = "../itsanas-discover" }
itsanas-folder = { version = "0.1.0", path = "../itsanas-folder" }
itsanas-net = { version = "0.1.0", path = "../itsanas-net" }
itsanas-node = { version = "0.1.0", path = "../itsanas-node" }
itsanas-placement = { version = "0.1.0", path = "../itsanas-placement" }
itsanas-policy = { version = "0.1.0", path = "../itsanas-policy" }
itsanas-release = { version = "0.1.0", path = "../itsanas-release" }
itsanas-store = { version = "0.1.0", path = "../itsanas-store" }
itsanas-sync = { version = "0.1.0", path = "../itsanas-sync", default-features = false }
postcard = { version = "1.1.1", default-features = false, features = ["use-std"] }
rpassword = "7.4.0"
serde = { version = "1.0.229", features = ["derive"] }
# The JSON the shells parse, answered by the account and device calls moved here
# from the phone (they build it with `json!`).
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.20"
zeroize = "1.9.0"
fs4 = { version = "1.1.0", default-features = false }

[features]
# The in-process coordinator and serving machine of `testing`, for a shell
# crate's tests (the phone's). Nothing ships with it.
testing = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams"] }

[target.'cfg(target_os = "macos")'.dependencies]
getrandom = "0.4.3"
itsanas-touchid = { version = "0.1.0", path = "../itsanas-touchid" }
security-framework = "3"

[lints]
workspace = true

[dev-dependencies]
# A real coordinator in process, with the `hostile` hooks the device tests use.
itsanas-coord = { version = "0.1.0", path = "../itsanas-coord", features = ["hostile"] }
# blake3 and tempfile are ordinary dependencies now: `itsanas bench` ships.
