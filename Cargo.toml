[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.85 would cover edition 2024, but let-chains (`if let Some(x) = a && b`) are
# used throughout and were stabilised in 1.88. Verified by running
# `cargo +1.88.0 check --workspace --all-features`, which the CI msrv job
# repeats on every push.
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SigSeg/itsanas"
authors = ["Nicolas Girard <nicolas.girard.e@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
