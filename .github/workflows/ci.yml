name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory against a dependency surfaces even
    # when nobody has pushed. A storage system people trust with their data
    # cannot only learn about CVEs when someone happens to open a PR.
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  # Deliberately *not* `RUSTFLAGS: -D warnings`. RUSTFLAGS applies to every
  # crate compiled, dependencies included, so one upstream crate emitting a
  # deprecation warning would fail our build for a reason we cannot fix and did
  # not cause. Warnings are denied where they are ours to fix: on the clippy
  # invocation below, which is scoped to this workspace.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Broken intra-doc links are the quietest kind of rot: the documentation
      # keeps claiming a relationship the code no longer has, and nothing fails
      # until a reader clicks it. This project's docs carry a lot of the design
      # rationale, so they are worth compiling.
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
      # The test catalogue is the project's main evidence that a given property
      # is actually guarded. An entry naming a test that no longer exists reads
      # as evidence for nothing, and that has already happened once: three
      # `transport` tests survived in the catalogue after being deleted, one of
      # them in bold as the security property that mattered.
      - name: Test catalogue names real tests
        run: bash scripts/check-catalogue.sh
      # `cargo fmt` removes a string literal's trailing backslash and joins the
      # lines, keeping the indentation as literal spaces. The code compiles,
      # clippy is silent, and the user reads "It still receives          the
      # log". Every continuation in this repository had been eaten that way,
      # including the one line an operator sees when a peer is sanctioned.
      # Nothing else in the toolchain reads the inside of a string.
      # Two things nothing else in the toolchain looks at, both of which have
      # already shipped broken. `cargo fmt` removes a string literal's trailing
      # backslash and keeps the indentation as literal spaces — every
      # continuation in this repository had been eaten that way, including the
      # one line an operator sees when a peer is sanctioned. And the scripts
      # that write large edits splice text in by concatenation, which is copied
      # through literally when it lands inside a quoted block: six files carried
      # a raw Python splice in their comments and one was committed that way.
      - name: Messages say what they mean
        run: python scripts/check-messages.py
      # Four times in one session a mechanism was designed, implemented, tested,
      # documented, and wired to nothing — `itsanas-policy`, `unreliable_devices`,
      # `Reliability::complaint`, `PushReport::push_bytes`. Each was found by a
      # human noticing, which is not a process. This workspace is the only
      # consumer there is, so a `pub fn` nobody calls is unfinished or forgotten
      # work, and the two look identical from outside.
      - name: Every public method has a call site
        run: python scripts/check-wired.py

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three platforms ITSaNAS actually has to run on, plus macOS as a
        # cheap check that nothing has quietly become Windows- or Linux-only.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  slow-tests:
    name: Expensive tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tests marked #[ignore] run real production cost parameters. Currently
      # that is one test — the full 64 MiB Argon2id — which is far too slow for
      # every push and far too important to never run. Large simulated swarms
      # will join it at M5.
      - run: cargo test --workspace --all-features -- --ignored --test-threads 1

  cross-build:
    name: Cross-build for Raspberry Pi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # Required, not belt-and-braces: blake3's build script compiles NEON
      # assembly for aarch64 and fails outright without a cross C compiler
      # ("failed to find tool aarch64-linux-gnu-gcc"). Everything else in the
      # tree is pure Rust.
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --workspace --release --target aarch64-unknown-linux-gnu

  android-core:
    name: Core compiles for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # The whole data path, checked for Android on every push. Not the whole
      # workspace: `ring` assembles its own primitives and needs the NDK, which
      # is a build-tool requirement rather than a code one and is documented in
      # docs/PORTING.md. Everything here is pure Rust, so a change that makes
      # the core unbuildable for a phone fails now rather than on the day
      # somebody tries to build the app.
      - run: |
          cargo check --target aarch64-linux-android             -p itsanas-crypto -p itsanas-store -p itsanas-sync             -p itsanas-policy -p itsanas-discover -p itsanas-placement             -p itsanas-wire

  minimum-rust-version:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  supply-chain:
    name: Dependency advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --all-features check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info
