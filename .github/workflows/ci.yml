name: CI

on:
  push:
    branches: [main]
  # `labeled` so that adding `milestone` to an open pull request runs the full
  # suite at once, rather than at its next push.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Daily, so a newly published advisory against a dependency surfaces the
    # day it is published rather than on the next unrelated PR. It was weekly
    # until 2026-09-14, when an advisory against rustls appeared that morning
    # and was first seen as a red main after two merges. A storage system
    # people trust with their data cannot learn about CVEs by accident.
    - cron: "17 4 * * *"

env:
  CARGO_TERM_COLOR: always
  # Deliberately *not* `RUSTFLAGS: -D warnings`. RUSTFLAGS applies to every
  # crate compiled, dependencies included, so one upstream crate emitting a
  # deprecation warning would fail our build for a reason we cannot fix and did
  # not cause. Warnings are denied where they are ours to fix: on the clippy
  # invocation below, which is scoped to this workspace.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a pull request touches decides what it tests: the crates it changed
  # and every crate that depends on them. Nicolas asked for it on 2026-10-06,
  # when a docs-only PR cost 23 runner-minutes. Everything that is not a pull
  # request, a PR labelled `milestone`, and a PR touching Cargo.lock, a
  # manifest, the toolchain, .config/, a workflow or the scope script itself,
  # runs in full. The rule, and what it cannot see, are in scripts/ci_scope.py
  # and docs/ROADMAP.md "Selective CI". Lint and the doc gates always run.
  #
  # A skipped job is green only because the last job below checks that this
  # one decided to skip it and wrote down why (docs/HANDOVER.md §5).
  changes:
    name: What this run tests
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      reason: ${{ steps.plan.outputs.reason }}
      plan: ${{ steps.plan.outputs.plan }}
      tests: ${{ steps.plan.outputs.tests }}
      slow: ${{ steps.plan.outputs.slow }}
      installers: ${{ steps.plan.outputs.installers }}
      acceptance: ${{ steps.plan.outputs.acceptance }}
      arm: ${{ steps.plan.outputs.arm }}
      android: ${{ steps.plan.outputs.android }}
      msrv: ${{ steps.plan.outputs.msrv }}
      coverage: ${{ steps.plan.outputs.coverage }}
      smoke: ${{ steps.plan.outputs.smoke }}
      test_args: ${{ steps.plan.outputs.test_args }}
      doc_args: ${{ steps.plan.outputs.doc_args }}
      build_args: ${{ steps.plan.outputs.build_args }}
    steps:
      # The whole history, so `origin/main...HEAD` has a merge base to find.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # cargo is on the runner image already; `cargo metadata --no-deps` reads
      # the manifests and resolves nothing. If it fails, the plan is a full run.
      - name: Decide what this run tests
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/ci_scope.py plan

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Broken intra-doc links are the quietest kind of rot: the documentation
      # keeps claiming a relationship the code no longer has, and nothing fails
      # until a reader clicks it. This project's docs carry a lot of the design
      # rationale, so they are worth compiling.
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
      # The test catalogue is the project's main evidence that a given property
      # is actually guarded. An entry naming a test that no longer exists reads
      # as evidence for nothing, and that has already happened once: three
      # `transport` tests survived in the catalogue after being deleted, one of
      # them in bold as the security property that mattered.
      - name: Test catalogue names real tests
        run: bash scripts/check-catalogue.sh
      # The counts those documents state are the project's headline evidence,
      # and all three files disagreed with the tree and with each other: 637 and
      # 29 in the README, 589 and sixteen in the roadmap, 637 and twenty-nine in
      # the catalogue, against a real 638 and 30. The catalogue's per-binary
      # table had drifted by one as well, in the row that accounted for the
      # difference. A number nobody reads back is not evidence.
      - name: Documented test counts match the source
        run: python scripts/check-counts.py
      # The same failure for the one number the whole bargain rests on. When the
      # split moved from 25/75 to 30/70 the code, its tests and ECONOMICS.md
      # moved with it, and nine other files did not -- FIRST-STEPS.md, the page
      # a new member reads first, among them. The grep that was supposed to find
      # them searched for `25/75` while the files said "costs three pledged".
      - name: Every document states the split the code ships
        run: python scripts/check-bargain.py
      # Each session starts cold and reads one block at the top of HANDOVER.md
      # to learn which step is next. That block was prose until 2026-09-14, and
      # the prose said "ten gates, all green" while an eleventh was red. This
      # checks the pointer names a real, unfinished §8 step written on this
      # history. It needs the history, hence the full fetch.
      - name: The handover pointer names a real step
        run: |
          git fetch --no-tags --prune --unshallow origin 2>/dev/null || true
          python scripts/check-handover.py
      # Two things nothing else in the toolchain looks at, both of which have
      # already shipped broken. `cargo fmt` removes a string literal's trailing
      # backslash and keeps the indentation as literal spaces — every
      # continuation in this repository had been eaten that way, including the
      # one line an operator sees when a peer is sanctioned. And the scripts
      # that write large edits splice text in by concatenation, which is copied
      # through literally when it lands inside a quoted block: six files carried
      # a raw Python splice in their comments and one was committed that way.
      #
      # It reads commands as well as messages now, because the same splice ate
      # the backslashes in this file: the Android step below ran with thirteen
      # spaces where its continuations had been, from the day it was written,
      # and the shell collapsed them so nothing ever complained.
      - name: Messages say what they mean
        run: python scripts/check-messages.py
      # Four times in one session a mechanism was designed, implemented, tested,
      # documented, and wired to nothing — `itsanas-policy`, `unreliable_devices`,
      # `Reliability::complaint`, `PushReport::push_bytes`. Each was found by a
      # human noticing, which is not a process. This workspace is the only
      # consumer there is, so a `pub fn` nobody calls is unfinished or forgotten
      # work, and the two look identical from outside.
      - name: Every public method has a call site
        run: python scripts/check-wired.py
      # A job here once ran for five hours before a person stopped it.
      # `cargo test` has no per-test timeout, so the only thing that ends a
      # hung test is somebody's patience. The budget lives in
      # .config/nextest.toml; this checks it still terminates rather than
      # merely warning, and that every test invocation in this file still
      # goes through the runner that enforces it. A timeout configured in a
      # file nothing uses reads like a guarantee and is not one.
      - name: Every test has a deadline, and every runner enforces it
        run: python scripts/check-test-budget.py
      # fmt, clippy and the documentation build have their own steps in this
      # file already; this one exists so that `scripts/check-all.sh` covers them
      # for a person about to push. It skips where there is no cargo, and CI
      # always has one, so here it is a second opinion rather than a duplicate.
      - name: The cargo gates, through the script contributors run
        run: bash scripts/check-rust.sh
      # The workspace forbids unsafe code and two places cannot: a JVM calls
      # `extern "system"` symbols by name, and Windows calls back into this
      # process with raw pointers. That exception is supposed to be those two
      # files and nothing else, and the claim appears in PORTING.md, in the
      # crate docs and in the README.
      #
      # This step is late to the file. The gate was written, sabotage-verified
      # against three rules, documented twice, and left out of CI for two days
      # -- so the sentence "the only unsafe in this project is in two named
      # files" was being enforced on one laptop and on no push. The step below
      # is what noticed.
      - name: The unsafe exception is the size the documentation claims
        run: python scripts/check-unsafe.py
      # And the reason that could happen: the list of gates in this file is
      # written by hand, while `scripts/check-all.sh` discovers them with a
      # glob. Adding a file to `scripts/` was enough to be run locally and not
      # enough to be run here, and both places looked complete.
      #
      # `check-installers.sh` carries the same warning about installers in its
      # own header. This is that mistake one level up, in the file that decides
      # what runs.
      - name: Every gate in scripts/ is actually run here
        run: python scripts/check-ci.py
      # A wrong scope does not fail anything: it makes CI green by testing
      # less, which is the one bug a CI cannot catch by running. So the
      # decision is tested here without git or GitHub -- a crypto-only change
      # must reach every dependent, docs-only must run no Rust test, Cargo.lock
      # must force the full run -- and this file is read to check every job
      # obeys the decision it is given.
      - name: The CI scope tests what it must
        run: python scripts/check-ci-scope.py
      # An installer is the one program here that runs on a machine nobody has
      # configured, in a shell nobody chose, in front of somebody who has read
      # nothing — and it is the least exercised code in the project. A syntax
      # error in it is a stranger pasting a command and getting "unexpected end
      # of file". Also checks that the Rust version each installer demands is
      # the one Cargo.toml actually needs, because a machine that passes the
      # installer's check and then fails to compile is the worst possible order
      # for those two to disagree.
      - name: Installers parse and agree with the manifest
        run: |
          # Preinstalled on ubuntu-latest; the `|| true` is for the day it is
          # not, because a missing linter must not fail a build over syntax it
          # was going to agree with.
          # A trailing `||` continues the line on its own, so there is no
          # backslash here for an editing script to eat. See check-messages.py.
          command -v shellcheck >/dev/null 2>&1 ||
            sudo apt-get install -y -qq shellcheck || true
          bash scripts/check-installers.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    # No job-level `if:` here, on purpose. These three legs are required
    # checks, and a matrix job skipped by `if:` reports under the name
    # "Test (${{ matrix.os }})", unexpanded, which no required check matches:
    # the pull request would wait forever. So every step is gated instead, and
    # the job passes having said why it tested nothing.
    strategy:
      fail-fast: false
      matrix:
        # The three platforms ITSaNAS actually has to run on, plus macOS as a
        # cheap check that nothing has quietly become Windows- or Linux-only.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: What this run tests
        shell: bash
        env:
          REASON: ${{ needs.changes.outputs.reason }}
          ARGS: ${{ needs.changes.outputs.test_args }}
          TESTS: ${{ needs.changes.outputs.tests }}
        run: |
          echo "plan: $REASON"
          if [ "$TESTS" = true ]; then echo "testing: $ARGS"; else echo "no crate is affected; nothing to test here"; fi
      - uses: actions/checkout@v7
        if: needs.changes.outputs.tests == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.tests == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.tests == 'true'
      # Printed so a slow run can be compared with a fast one: hosted runners
      # vary, and on 2026-09-14 a Windows test job took seven minutes where
      # three to five is usual. An earlier step here excluded build directories
      # from Defender on the theory that scanning caused those stalls; the
      # runner reported real-time protection already off, so it was removed.
      - name: How much machine this runner has
        if: needs.changes.outputs.tests == 'true'
        shell: bash
        run: echo "cores $(nproc 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")"
      # Test temporary files on a RAM disk, Windows only, so every test still
      # takes the production path -- redb commits and per-chunk sync_all -- but
      # the flush lands in memory. Chosen on 2026-09-14 over relaxing durability
      # in tests, which would have stopped ordinary tests exercising real
      # synchronous writes. The evidence: a coordinator test doing 400 redb
      # commits takes 0.76 s on a laptop and 21-37 s on this runner, 30-50x,
      # where a CPU-bound test is about 6x; on a stalled runner such tests
      # crossed the 60 s budget. tempfile reads TMP/TEMP, so both point here.
      - name: Test temporary files on a RAM disk
        if: runner.os == 'Windows' && needs.changes.outputs.tests == 'true'
        shell: pwsh
        run: |
          choco install imdisk-toolkit --no-progress -y | Out-Null
          imdisk -a -s 3G -m R: -p "/fs:ntfs /q /y"
          New-Item -ItemType Directory -Force R:\tmp | Out-Null
          "TMP=R:\tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=R:\tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $drive = Get-PSDrive R
          "RAM disk R: free {0:N1} GiB" -f ($drive.Free / 1GB)
      - name: Where tests will write their temporary files
        if: runner.os == 'Windows' && needs.changes.outputs.tests == 'true'
        shell: pwsh
        run: '"temp path: " + [System.IO.Path]::GetTempPath()'
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.tests == 'true'
      # nextest, not `cargo test`, because it runs each test in its own process
      # and can therefore time it out. The budget is in .config/nextest.toml:
      # one minute per test, no exceptions. `cargo test` has no such thing, and
      # a test that hangs under it hangs the job until a person kills it.
      #
      # The crates are the plan's: every one this run affects, or the
      # workspace on a full run.
      - name: The tests of every affected crate
        if: needs.changes.outputs.tests == 'true'
        run: cargo nextest run --profile ci ${{ needs.changes.outputs.test_args }} --all-features
      # nextest does not run doctests, so they need their own invocation. Left
      # out, this change would have quietly stopped running two tests while the
      # summary still said everything passed.
      # Only crates with a library have doctests; the plan lists those.
      - name: The doctests of every affected library
        if: needs.changes.outputs.tests == 'true' && needs.changes.outputs.doc_args != ''
        run: cargo test --doc ${{ needs.changes.outputs.doc_args }} --all-features

  slow-tests:
    name: Expensive tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.slow == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The #[ignore]d tests run real production cost parameters: the full
      # 64 MiB Argon2id, a store killed mid-write a dozen times, and a file
      # larger than any buffer. Too slow for every push, too important never to
      # run.
      #
      # **In release, and that is load-bearing.** In debug the crash test takes
      # 66 seconds and breaks the one-minute budget — not because of anything it
      # asserts, but because an unoptimised Argon2id is slow. In release the
      # three take 0.2 s, 2.4 s and 5.9 s. Running them here rather than writing
      # them a timeout exception is the difference between a budget that means
      # something and a list of things it does not apply to.
      - run: cargo nextest run --release --profile ci ${{ needs.changes.outputs.test_args }} --all-features --run-ignored ignored-only

  installers-run:
    name: The installer installs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # `check-installers.sh` reads these scripts. This one runs them, on a
    # machine of the kind each is written for, and lets each finish with the
    # store-and-read-back it ends in — so "it installs and the result works"
    # stops being a claim somebody made once on their own laptop.
    #
    # It exists because five defects were found in `install/linux.sh` in one
    # afternoon by taking the one-liner printed at the top of it, and every one
    # of them was invisible from reading the file: a comment that executed
    # because the heredoc around it was unquoted, a verification step reading a
    # variable only `--source` sets, a prompt that would have eaten the script
    # off its own stdin. Parsing a script says nothing about what it does.
    #
    # macOS matters most here: `install/macos.sh` had never been executed
    # anywhere, by anybody, and `macos-latest` is Apple silicon.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux
        if: runner.os == 'Linux'
        run: sh install/linux.sh --yes --no-service --prefix "$HOME/itsanas-ci"
      - name: macOS
        if: runner.os == 'macOS'
        run: sh install/macos.sh --yes --no-service --prefix "$HOME/itsanas-ci"
      - name: Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          powershell -ExecutionPolicy Bypass -File install\windows.ps1
          -Yes -NoService -Prefix "$env:RUNNER_TEMP\itsanas-ci"

  acceptance-local:
    name: Acceptance phases between three local nodes
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.acceptance == 'true'
    # `scripts/acceptance.sh` is what the MVP verdict is taken with, on four real
    # machines, by a person, in a morning that is expensive to waste. This runs
    # every phase here first between three nodes of one account and a throwaway
    # coordinator -- once where it must pass and once where it must fail -- so a
    # check that cannot pass, or cannot fail, is found on a push rather than on
    # the fleet. Its first run found both: two checks printed FAIL and exited 0,
    # and F "passed" on a file that had never arrived.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `itsanas-coordinator` is its own crate; `itsanas-coord` is the library.
      # The first run of this job built the library and found no server.
      - run: cargo build -p itsanas-cli -p itsanas-coordinator --bins
      - run: bash -n scripts/acceptance.sh && bash -n scripts/acceptance-local.sh
      - name: Every phase passes where it must and fails where it must
        run: bash scripts/acceptance-local.sh target/debug/itsanas target/debug/itsanas-coordinator

  cross-build:
    name: Builds and runs on ARM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.arm == 'true'
    # Every step here builds or runs aarch64, so these belong to the job rather
    # than to one step of it. Setting the linker on the build step alone is what
    # made the test step try to link aarch64 objects with the host `cc`, which
    # fails with "--fix-cortex-a53-843419 is only supported on AArch64" -- a
    # message about the target that is really about the linker.
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64-static
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # Required, not belt-and-braces: blake3's build script compiles NEON
      # assembly for aarch64 and fails outright without a cross C compiler
      # ("failed to find tool aarch64-linux-gnu-gcc"). Everything else in the
      # tree is pure Rust.
      - name: Cross C compiler, bounded so a stalled mirror fails in minutes
        timeout-minutes: 10
        run: |
          sudo sed -i 's|http://.*archive.ubuntu.com/ubuntu|http://mirrors.cloudflare.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::ForceIPv4=true \
                       -o Acquire::http::Pipeline-Depth=0 \
                       -o Acquire::http::Timeout=10 \
                       -o Acquire::Retries=2 \
                       update
          sudo apt-get -o Acquire::ForceIPv4=true \
                       -o Acquire::http::Timeout=10 \
                       -o Acquire::Retries=2 \
                       install -y gcc-aarch64-linux-gnu
      - uses: taiki-e/install-action@nextest
      - name: Build
        run: cargo build ${{ needs.changes.outputs.build_args }} --release --target aarch64-unknown-linux-gnu
      # A build says the types line up. It does not say the code runs, and until
      # this step existed no line of this project had ever executed on an ARM
      # processor -- the machine half its constants are chosen for. aarch64 is
      # where blake3 switches to its NEON backend, which can link cleanly and
      # hash wrong.
      #
      # `qemu-user-static` runs the binary against the sysroot the cross
      # compiler already installed, so this costs one apt package and no
      # container images.
      #
      # It emulates the instruction set on this machine's kernel, which is a
      # narrower claim than "runs on ARM". It does not reproduce aarch64's weak
      # memory ordering -- the one architectural difference that bites a
      # threaded program -- because the host is x86 and orders more strongly.
      # It reports an emulated CPU's features, so a library that picks its code
      # path at runtime may pick a different one here than on a Cortex-A72. And
      # it says nothing about whether a Pi 4B has the memory for a terabyte of
      # index. That question needs the Pi. This is the floor.
      - run: sudo apt-get install -y qemu-user-static
      # cargo knows how to hand a test binary to an emulator, so the whole suite
      # can run on the target architecture for the price of one env var. This is
      # the strong version of the claim: not "a file went in and came out" but
      # every property this project checks, checked on ARM.
      #
      # It is also what covers `ring`. The smoke test below never opens a
      # socket, so the TLS stack is only linked by it; `itsanas-tls`'s handshake
      # tests do open one, and ring's aarch64 assembly is exactly the kind of
      # thing that links and then misbehaves.
      # Through nextest, for the timeout. Emulation is where a hang is most
      # likely and least visible: a deadlock that a native run would never
      # reach can appear here through different timing, and without a per-test
      # limit the job simply stops producing output until the runner's own
      # six-hour ceiling. nextest picks up the runner from the cargo
      # environment variable set at the job level, the same one plain
      # `cargo test` used.
      - name: The whole test suite, on ARM
        run: cargo nextest run --profile ci-emulated ${{ needs.changes.outputs.test_args }} --all-features --target aarch64-unknown-linux-gnu
      # The doctests, which nextest does not run, and which `cargo test` does
      # not cross-run under a target runner either -- so they stay on the
      # native job above and are named here so their absence is a decision
      # rather than an oversight.
      # And the same check an installer runs at the end of a real install, so
      # the thing a person sees on their own machine is the thing CI ran.
      # Only when the plan built `itsanas`, which is whenever itsanas-cli is
      # affected -- and a store or crypto change always reaches it.
      - name: Store a file and read it back, on ARM
        if: needs.changes.outputs.smoke == 'true'
        env:
          ITSANAS_RUNNER: qemu-aarch64-static
        run: sh scripts/smoke.sh target/aarch64-unknown-linux-gnu/release/itsanas

  android-core:
    name: Core compiles for Android
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # This job claimed for weeks that the crates below were "pure Rust" and so
      # needed no NDK. The first run of this workflow disproved it in one line:
      # `blake3` compiles C for its SIMD backends, so even `cargo check` — which
      # runs build scripts — needs a cross compiler. Resolve one explicitly.
      - name: Point cc-rs at the Android NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            echo "no Android NDK on this runner; set ANDROID_NDK_HOME" >&2
            exit 1
          fi
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # The wrappers are named for the API level they target. Take the
          # lowest one present rather than pinning a number a later NDK drops.
          cc=$(ls "$bin"/aarch64-linux-android[0-9]*-clang 2>/dev/null |
                 sort -V | head -1)
          if [ -z "$cc" ]; then
            echo "no aarch64 clang wrapper under $bin" >&2
            ls "$bin" >&2 || true
            exit 1
          fi
          echo "cross compiler: $cc"
          {
            echo "CC_aarch64_linux_android=$cc"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
          } >> "$GITHUB_ENV"
      # The whole data path, checked for Android on every push. Not the whole
      # workspace: `ring` assembles its own primitives, which is a separate
      # question documented in docs/PORTING.md. A change that makes the core
      # unbuildable for a phone fails here rather than on the day somebody
      # tries to build the app.
      - run: >-
          cargo check --target aarch64-linux-android
          -p itsanas-crypto -p itsanas-store -p itsanas-sync
          -p itsanas-policy -p itsanas-discover -p itsanas-placement
          -p itsanas-wire

  minimum-rust-version:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.msrv == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check ${{ needs.changes.outputs.build_args }} --all-features

  supply-chain:
    name: Dependency advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --all-features check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    # A subset's coverage is a misleading number and gates nothing, so it is
    # measured on full runs only: main, nightly, and `milestone` PRs.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info

  no-warnings:
    name: No warnings anywhere in this run
    runs-on: ubuntu-latest
    # Every other job has to pass first, so this only ever judges a green run.
    #
    # Why it exists: on 2026-09-14 every run carried fourteen warnings --
    # actions/checkout and upload-artifact still on Node.js 20 -- and nothing
    # failed, so nobody looked. A warning that is allowed to stay teaches people
    # to stop reading warnings, and the next one is the one that mattered. This
    # reads the annotations of every check run in this run and fails on any at
    # warning or failure level.
    # `!cancelled()`: by default a job whose needs were skipped is skipped too,
    # and this one must run precisely then, to judge the skips.
    if: ${{ !cancelled() }}
    needs:
      - changes
      - lint
      - test
      - slow-tests
      - installers-run
      - acceptance-local
      - cross-build
      - android-core
      - minimum-rust-version
      - supply-chain
      - coverage
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The merge rule (docs/HANDOVER.md §5): skipped is green only when the
      # `changes` job decided the skip and wrote down why. This is where that
      # is checked, so a skip nobody planned -- or any failure -- turns this
      # check red, and merge-when-green.sh refuses a skip unless this passed.
      - name: Every skipped job was skipped by the plan, for a written reason
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_scope.py verify
      - name: Every annotation in this run is a notice at most
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          suite=$(gh api "repos/$REPO/actions/runs/$RUN" -q .check_suite_id)
          gh api --paginate "repos/$REPO/check-suites/$suite/check-runs" \
            -q '.check_runs[] | "\(.id)\t\(.name)"' > runs.tsv
          : > found.tsv
          while IFS="$(printf '\t')" read -r id name; do
            [ "$name" = "No warnings anywhere in this run" ] && continue
            gh api "repos/$REPO/check-runs/$id/annotations" \
              -q '.[] | select(.annotation_level != "notice") | .annotation_level + "\t" + (.message | gsub("\n"; " "))' |
              sed "s/^/$name\t/" >> found.tsv
          done < runs.tsv
          # The one allowed line, and only it: taiki-e/install-action prints a
          # warning when a Windows runner's bash fails to start and it retries.
          # It describes GitHub's machine, not this project, and passes on retry.
          grep -v "install-action: installation failed due to bash startup failure" found.tsv > unexpected.tsv || true
          if [ -s unexpected.tsv ]; then
            echo "this run produced warnings (job, level, message):"
            cat unexpected.tsv
            exit 1
          fi
          echo "no warnings across $(wc -l < runs.tsv) check runs"
