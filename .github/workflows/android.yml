name: Android

# The phone app: the Rust core cross-compiled by cargo-ndk, then the Kotlin
# shell built by Gradle. Nothing else in CI compiles the Kotlin, so a step that
# touches android/ is only checked here. In its own workflow because ci.yml is
# protected from remote writes.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - android/**
      - crates/itsanas-android/**
      - crates/itsanas-cli/src/setup/web/**
      - crates/itsanas-cli/src/shell.rs
      - scripts/build-apk.sh
      - scripts/android-e2e.sh
      - .github/workflows/android.yml

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: The APK assembles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build the debug APK
        env:
          GRADLE: gradle
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export JAVA_HOME="${JAVA_HOME:-$JAVA_HOME_17_X64}"
          bash scripts/build-apk.sh debug
      - uses: actions/upload-artifact@v7
        with:
          name: itsanas-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
