name: Retry a platform job once

# The macOS and ARM jobs fail now and then for the runner, not the code: no Mac
# free for half an hour, a lost runner, a simulator that never booted. Each one
# used to cost a session reading a log and pressing re-run. This workflow re-runs
# the failed jobs of a CI run once, by itself, when a failed or cancelled job is
# one of those; a second failure is left for a person, since by then it is
# likely the code.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    name: Re-run a macOS or ARM job that failed
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Re-run the failed jobs when a platform job is among them
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          failed="$(gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name')"
          printf 'failed jobs:\n%s\n' "$failed"
          if printf '%s\n' "$failed" | grep -qE 'iPhone|macos|ARM'; then
            gh run rerun "$RUN" --repo "$REPO" --failed
            echo "re-ran the failed jobs once"
          else
            echo "no macOS or ARM job failed: nothing to re-run"
          fi
