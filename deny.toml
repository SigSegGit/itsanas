[graph]
all-features = true

[advisories]
version = 2
# Any unpatched advisory against a dependency fails CI. For a project whose
# entire value proposition is "your host cannot read your data", a known-
# vulnerable crypto or parsing dependency is a release blocker, not a warning.
yanked = "deny"

[licenses]
version = 2
# AGPL-3.0 can absorb these; anything else needs a deliberate decision.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
